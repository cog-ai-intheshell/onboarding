<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Coordonnées du participant au bootcamp NXT." />
    <meta name="theme-color" content="#08090c" />
    <title>Faisons connaissance — NXT</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=16" />
  </head>
  <body class="profile-page">
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="/" aria-label="NXT, retour à l’accueil">
        <span class="brand__symbol" aria-hidden="true"></span>
        <span>NXT</span>
      </a>
      <div class="header-status">
        <span class="header-status__dot" aria-hidden="true"></span>
        <span>Session ouverte</span>
      </div>
    </header>

    <main class="profile-main">
      <section class="profile-content" aria-labelledby="profile-title">
        <p class="admin-eyebrow">Avant de commencer</p>
        <h1 id="profile-title">Faisons connaissance.</h1>
        <p class="profile-intro">Ces informations nous permettront d’associer tes réponses à ton profil et de te recontacter au sujet du bootcamp.</p>

        <div class="profile-loading" id="profile-loading" aria-live="polite">Chargement…</div>

        <form class="profile-form" id="profile-form" novalidate hidden>
          <div class="profile-form__row">
            <label for="first-name">
              <span>Prénom</span>
              <input id="first-name" name="firstName" type="text" maxlength="100" autocomplete="given-name" required />
            </label>
            <label for="last-name">
              <span>Nom</span>
              <input id="last-name" name="lastName" type="text" maxlength="100" autocomplete="family-name" required />
            </label>
          </div>
          <label for="phone">
            <span>Téléphone</span>
            <input id="phone" name="phone" type="tel" maxlength="30" autocomplete="tel" placeholder="+33 6 00 00 00 00" required />
          </label>
          <label for="email">
            <span>Email</span>
            <input id="email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="prenom@entreprise.com" required />
          </label>

          <p class="profile-error" id="profile-error" role="alert"></p>
          <button class="button button--primary button--wide" type="submit">
            <span>Continuer vers le questionnaire</span><span aria-hidden="true">→</span>
          </button>
          <p class="profile-privacy">Tes coordonnées restent confidentielles et sont uniquement accessibles par l’équipe du bootcamp.</p>
        </form>
      </section>
    </main>

    <script src="app.js?v=10" defer></script>
  </body>
</html>
